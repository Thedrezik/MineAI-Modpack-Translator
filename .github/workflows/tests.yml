name: Tests

on:
  push:
    branches: [main, beta, beta41, beta42, beta43, beta44, beta45]
  pull_request:
    branches: [main, beta, beta41, beta42, beta43, beta44, beta45]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Compile sources
        run: python -m compileall -q formatkit mineai tests tools translator.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt production smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "from PyQt6.QtWidgets import QApplication; from mineai.gui_qt.main_window import TranslatorQtWindow; app = QApplication([]); window = TranslatorQtWindow(); assert window.centralWidget() is not None; window.close(); app.processEvents(); print('Qt production smoke PASS')"

  windows-package:
    name: windows-package
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Build production EXE through build.bat
        shell: cmd
        run: build.bat
      - name: Verify packaged EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\MineAI_Translator_Beta45.exe")) {
            throw "dist\MineAI_Translator_Beta45.exe was not created"
          }
          $size = (Get-Item "dist\MineAI_Translator_Beta45.exe").Length
          if ($size -lt 30000000) {
            throw "Packaged EXE is unexpectedly small: $size bytes"
          }
          Write-Host "Packaged EXE size $size bytes"
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path "dist\MineAI_Translator_Beta45.exe").Path
          $psi.WorkingDirectory = $env:RUNNER_TEMP
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables["QT_QPA_PLATFORM"] = "offscreen"
          $process = [System.Diagnostics.Process]::Start($psi)
          if ($null -eq $process) {
            throw "Packaged EXE could not be started"
          }
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Packaged EXE exited during Qt smoke test with code $($process.ExitCode)"
            }
            Write-Host "Packaged Qt EXE smoke PASS"
          }
          finally {
            taskkill /PID $process.Id /T /F 2>$null | Out-Null
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MineAI-Translator-Windows
          path: dist/MineAI_Translator_Beta45.exe
          if-no-files-found: error
